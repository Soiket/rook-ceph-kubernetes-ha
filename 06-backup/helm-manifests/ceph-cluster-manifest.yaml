# Source: rook-ceph-cluster/templates/deployment.yaml
kind: Deployment
apiVersion: apps/v1
metadata:
  name: rook-ceph-tools
  namespace: rook-ceph # namespace:cluster
  labels:
    app: rook-ceph-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rook-ceph-tools
  template:
    metadata:
      labels:
        app: rook-ceph-tools
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      containers:
        - name: rook-ceph-tools
          image: "quay.io/ceph/ceph:v20.2.4"
          command:
            - /bin/bash
            - -c
            - |
              # The script is inlined because the ceph image does not ship toolbox.sh.
              # AUTOGENERATED from images/ceph/toolbox.sh; do not edit. Run: make gen-toolbox
              # inputs
              ENDPOINT_MOUNT="/etc/rook/mon-endpoints"
              KEYRING_MOUNT="/var/lib/rook-ceph-mon/secret.keyring"
              CONFIG_OVERRIDE_MOUNT="/etc/rook-config-override/config"

              # outputs
              CEPH_CONFIG="/etc/ceph/ceph.conf"
              KEYRING_FILE="/etc/ceph/keyring"

              config_override_exists() {
                [ -f "${CONFIG_OVERRIDE_MOUNT}" ] && [ -s "${CONFIG_OVERRIDE_MOUNT}" ]
              }

              # create/update the ceph keyring file
              write_keyring() {
                DATE=$(date)

                # read the secret from an env var (for backward compatibility), or from the secret file
                ceph_secret=${ROOK_CEPH_SECRET}
                if [[ "$ceph_secret" == "" ]]; then
                  ceph_secret=$(cat ${KEYRING_MOUNT})
                fi

                echo "$DATE writing keyring to ${KEYRING_FILE}"
                cat <<EOF > ${KEYRING_FILE}
              [${ROOK_CEPH_USERNAME}]
              key = ${ceph_secret}
              EOF

              } # write_keyring()

              # create/update the ceph config file in its default location so ceph/rados tools can be used
              # without specifying any arguments
              write_conf() {
                DATE=$(date)

                # filter out the mon names
                # external cluster can have numbers or hyphens in mon names, handling them in regex
                # shellcheck disable=SC2001
                mon_endpoints=$(cat ${ENDPOINT_MOUNT}| sed 's/[a-z0-9_-]\+=//g')

                config_override=""
                if config_override_exists; then
                  echo "$DATE merging config override from ${CONFIG_OVERRIDE_MOUNT}"
                  config_override=$(cat "${CONFIG_OVERRIDE_MOUNT}")
                fi

                echo "$DATE writing mon endpoints to ${CEPH_CONFIG}: ${mon_endpoints}"
                cat << EOF > ${CEPH_CONFIG}
              [global]
              mon_host = ${mon_endpoints}

              [client.admin]
              keyring = ${KEYRING_FILE}

              ${config_override}
              EOF

              } # write_conf()

              # watch the ceph config directory and update if the mon endpoints or keyring change
              watch_etc_ceph() {
                # get the timestamp for the targets of the soft links
                keyring_mount_path=$(realpath "${KEYRING_MOUNT}")
                keyring_init_time=$(stat -c %Z "${keyring_mount_path}")

                endpoint_mount_path=$(realpath "${ENDPOINT_MOUNT}")
                endpoint_init_time=$(stat -c %Z "${endpoint_mount_path}")

                override_mount_path=""
                override_init_time=""
                if config_override_exists; then
                  override_mount_path=$(realpath "${CONFIG_OVERRIDE_MOUNT}")
                  override_init_time=$(stat -c %Z "${override_mount_path}")
                fi

                while true; do
                  sleep 10
                  DATE=$(date)

                  # keyring file
                  keyring_mount_path=$(realpath "${KEYRING_MOUNT}")
                  keyring_latest_time="$(stat -c %Z "${keyring_mount_path}")"

                  if [ "${keyring_latest_time}" != "${keyring_init_time}" ]; then
                    echo "$DATE keyring changed"
                    write_keyring
                    keyring_init_time="${keyring_latest_time}"
                  fi

                  # ceph.conf file / config override
                  endpoint_mount_path=$(realpath "${ENDPOINT_MOUNT}")
                  endpoint_latest_time=$(stat -c %Z "${endpoint_mount_path}")

                  override_mount_path=""
                  override_latest_time=""
                  if config_override_exists; then
                    override_mount_path=$(realpath "${CONFIG_OVERRIDE_MOUNT}")
                    override_latest_time=$(stat -c %Z "${override_mount_path}")
                  fi

                  need_conf_update=false

                  if [ "${endpoint_latest_time}" != "${endpoint_init_time}" ]; then
                    echo "$DATE mon endpoints changed"
                    need_conf_update=true
                  fi

                  if [ "${override_latest_time}" != "${override_init_time}" ]; then
                    echo "$DATE config override changed"
                    need_conf_update=true
                  fi

                  if $need_conf_update; then
                    write_conf
                    endpoint_init_time="${endpoint_latest_time}"
                    override_init_time="${override_latest_time}"
                  fi
                done
              }

              # write the initial config files
              write_keyring
              write_conf

              # continuously update the config files for mon failover and/or cephx key rotation
              if [ "$1" != "--skip-watch" ]; then
                watch_etc_ceph
              fi
              # END AUTOGENERATED
          imagePullPolicy: IfNotPresent
          tty: true
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 2016
            runAsNonRoot: true
            runAsUser: 2016
          env:
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-username
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-config
            - name: mon-endpoint-volume
              mountPath: /etc/rook
            - name: ceph-admin-secret
              mountPath: /var/lib/rook-ceph-mon
            - name: rook-config-override
              mountPath: /etc/rook-config-override
              readOnly: true
      serviceAccountName: rook-ceph-default
      volumes:
        - name: ceph-admin-secret
          secret:
            secretName: rook-ceph-mon
            optional: false
            items:
              - key: ceph-secret
                path: secret.keyring
        - name: mon-endpoint-volume
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: rook-config-override
          configMap:
            name: rook-config-override
            optional: true
        - name: ceph-config
          emptyDir: {}
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 5
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
---
# Source: rook-ceph-cluster/templates/cephcluster.yaml
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: "rook-ceph"
  namespace: "rook-ceph" # namespace:cluster
spec:
  monitoring:
    enabled: false
  cephVersion:
    image: "quay.io/ceph/ceph:v20.2.4"
    allowUnsupported: false
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
  cleanupPolicy:
    allowUninstallWithVolumes: false
    confirmation: ""
    sanitizeDisks:
      dataSource: zero
      iteration: 1
      method: quick
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  crashCollector:
    disable: false
  dashboard:
    enabled: true
    ssl: true
  dataDirHostPath: /var/lib/rook
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mgr:
        disabled: false
      mon:
        disabled: false
      osd:
        disabled: false
  logCollector:
    enabled: true
    maxLogSize: 500M
    periodicity: daily
  mgr:
    allowMultiplePerNode: false
    count: 2
    modules:
    - enabled: false
      name: rook
  mon:
    allowMultiplePerNode: false
    count: 3
  network:
    addressRanges:
      cluster:
      - 10.10.12.0/24
      public:
      - 10.10.11.0/24
    connections:
      compression:
        enabled: false
      encryption:
        enabled: false
      requireMsgr2: true
    provider: host
  placement:
    all:
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
  priorityClassNames:
    mgr: system-cluster-critical
    mon: system-node-critical
    osd: system-node-critical
  removeOSDsIfOutAndSafeToRemove: false
  resources:
    cleanup:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 100Mi
    cmd-reporter:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 100Mi
    crashcollector:
      limits:
        memory: 60Mi
      requests:
        cpu: 100m
        memory: 60Mi
    exporter:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 50Mi
    logcollector:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 100Mi
    mgr:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    mgr-sidecar:
      limits:
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 40Mi
    mon:
      limits:
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 1Gi
    osd:
      limits:
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 4Gi
    prepareosd:
      requests:
        cpu: 500m
        memory: 50Mi
  security:
    cephx:
      csi:
        keyType: aes
  skipUpgradeChecks: false
  storage:
    nodes:
    - devices:
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812131
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812137
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812134
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812145
      name: k8s-storage-node1
    - devices:
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812132
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812141
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812133
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812136
      name: k8s-storage-node2
    - devices:
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812085
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812067
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812091
      - name: /dev/disk/by-id/scsi-SATA_MZ7LH3T8HMLT0D3_S451NY0M812147
      name: k8s-storage-node3
    useAllDevices: false
    useAllNodes: false
  upgradeOSDRequiresHealthyPGs: false
  waitTimeoutForHealthyOSDInMinutes: 10

